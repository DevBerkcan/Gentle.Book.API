services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - gentlebook-mssqldata:/var/opt/mssql

  # Local mail catcher for development + E2E (e2e/fixtures.ts polls its API on :5080).
  # appsettings.Development.json sends via localhost:1025. Web UI: http://localhost:5080
  smtp4dev:
    image: rnwood/smtp4dev:v3
    ports:
      - "5080:80"
      - "1025:25"

volumes:
  gentlebook-mssqldata:
